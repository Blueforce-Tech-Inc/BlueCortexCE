<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root {
        color-scheme: light dark;
    }
    body {
        margin: 0;
        padding: 8px 12px;
        background: #1e1e2e;
        color: #cdd6f4;
        font-family: -apple-system, "SF Mono", Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
    }
    json-viewer {
        --background-color: #1e1e2e;
        --color: #cdd6f4;
        --string-color: #a6e3a1;
        --number-color: #fab387;
        --boolean-color: #f38ba8;
        --null-color: #6c7086;
        --key-color: #89b4fa;
        --font-size: 13px;
    }
    #error {
        color: #f38ba8;
        padding: 20px;
    }
    #loading {
        color: #6c7086;
        padding: 20px;
    }
</style>
</head>
<body>
<div id="loading">Loading JSON viewer...</div>
<div id="error" style="display:none;"></div>
<json-viewer id="viewer" style="display:none;"></json-viewer>
<script src="json-viewer.js"></script>
<script>
    // Hide loading message once script loads
    window.addEventListener('load', function() {
        setTimeout(function() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('viewer').style.display = 'block';
        }, 100);
    });

    window.renderJson = function(jsonString) {
        try {
            const viewer = document.getElementById('viewer');
            if (viewer && typeof viewer.data !== 'undefined') {
                viewer.data = JSON.parse(jsonString);
            } else {
                // Fallback: pretty-print JSON manually
                document.getElementById('viewer').style.display = 'none';
                document.getElementById('loading').style.display = 'none';
                var err = document.getElementById('error');
                err.style.display = 'block';
                err.innerHTML = '<pre style="white-space:pre-wrap;word-wrap:break-word;color:#cdd6f4;">' + JSON.stringify(JSON.parse(jsonString), null, 2) + '</pre>';
            }
        } catch(e) {
            document.getElementById('loading').style.display = 'none';
            document.body.innerHTML = '<pre id="error" style="color:#f38ba8;">JSON Error: ' + e + '</pre>';
        }
    };
</script>
</body>
</html>
