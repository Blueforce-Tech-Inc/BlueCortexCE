<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root {
        color-scheme: light dark;
    }
    body {
        margin: 0;
        padding: 8px 12px;
        background: #1e1e2e;
        color: #cdd6f4;
        font-family: -apple-system, "SF Mono", Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
    }
    json-viewer {
        --background-color: #1e1e2e;
        --color: #cdd6f4;
        --string-color: #a6e3a1;
        --number-color: #fab387;
        --boolean-color: #f38ba8;
        --null-color: #6c7086;
        --key-color: #89b4fa;
        --font-size: 13px;
        display: block;
    }
    #loading, #error {
        padding: 20px;
        color: #6c7086;
    }
    #error {
        color: #f38ba8;
        display: none;
    }
</style>
</head>
<body>
<div id="loading">Loading JSON viewer...</div>
<div id="error"></div>
<json-viewer id="viewer"></json-viewer>
<script src="json-viewer.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', function() {
        // Check if json-viewer is registered
        if (customElements.get('json-viewer')) {
            document.getElementById('loading').style.display = 'none';
        } else {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = 'Error: json-viewer component not loaded';
        }
    });

    window.renderJson = function(jsonString) {
        try {
            const viewer = document.getElementById('viewer');
            if (viewer && customElements.get('json-viewer')) {
                viewer.data = JSON.parse(jsonString);
            } else {
                showFallbackError('json-viewer not available');
            }
        } catch(e) {
            showFallbackError('JSON Error: ' + e.message);
        }
    };

    function showFallbackError(msg) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('viewer').style.display = 'none';
        var err = document.getElementById('error');
        err.style.display = 'block';
        err.innerHTML = '<pre style="color:#f38ba8">' + msg + '</pre>';
    }
</script>
</body>
</html>
