server:
  port: ${SERVER_PORT:37777}
  address: ${SERVER_ADDRESS:127.0.0.1}

# ============================================================================
# Evo-Memory Feature Flags (Section 6.1.1)
# ============================================================================
app:
  memory:
    # Enable/disable memory refinement (Phase 2)
    # When disabled, no refinement happens but quality scoring still works
    refine-enabled: ${MEMORY_REFINE_ENABLED:true}
    
    # Minimum quality an observation needs to be returned by quality-aware
    # experience retrieval (ExpRagService -> findHighQualityObservations).
    # Observations scoring below this are not picked as ICL samples.
    # This is NOT a filter on search or context retrieval — those paths do not
    # look at quality_score. Note that a separate literal 0.6 also gates the
    # refine candidate query (MemoryRefineService.findStaleObservations) and is
    # not driven by this value.
    quality-threshold: ${MEMORY_QUALITY_THRESHOLD:0.6}
    
    # Refinement thresholds
    refine:
      # Delete observations with quality below this
      delete-threshold: ${MEMORY_REFINE_DELETE_THRESHOLD:0.3}
      # Cooldown days before allowing re-refinement
      cooldown-days: ${MEMORY_REFINE_COOLDOWN_DAYS:7}
      # Days before observation is considered stale
      stale-days: ${MEMORY_REFINE_STALE_DAYS:30}

    # Phase 3: Structured extraction configuration
    extraction:
      enabled: ${EXTRACTION_ENABLED:false}
      initial-run-max-candidates: ${EXTRACTION_MAX_CANDIDATES:100}
      max-observations-per-batch: ${EXTRACTION_BATCH_SIZE:20}
      max-batches-per-template: ${EXTRACTION_MAX_BATCHES:10}
      templates:
        - name: "user_preference"
          enabled: true
          template-class: "java.util.Map"
          session-id-pattern: "pref:{project}:{userId}"
          source-filter: ["user_statement", "manual"]
          key-fields: ["category", "value"]
          prompt: |
            From the following conversation observations, extract user preferences.
            A preference is a stable choice, opinion, or constraint expressed by the user.

            Return a JSON object with a "preferences" array. Each item should have:
            - "category": the domain (e.g. "phone_brand", "price_range", "food")
            - "value": what the user prefers
            - "sentiment": "positive", "negative", or "neutral"
            - "confidence": 0.0 to 1.0

            If prior extraction is provided:
            - KEEP items that are still valid
            - REMOVE items contradicted by new observations
            - ADD new items from new observations
            - Do NOT re-add items already in prior unless confidence changed
          output-schema: |
            {"type":"object","properties":{"preferences":{"type":"array","items":{"type":"object","properties":{"category":{"type":"string"},"value":{"type":"string"},"sentiment":{"type":"string"},"confidence":{"type":"number"}},"required":["category","value"]}}}}

spring:
  application:
    name: claude-mem-java

  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
      # Note: ChatModel and EmbeddingModel are created manually in SpringAiConfig

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1/claude_mem_dev}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:123456}}
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1680000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  threads:
    virtual:
      enabled: true

  jackson:
    property-naming-strategy: SNAKE_CASE

  ai:
    # Explicit bindings: the variables in backend/.env (OPENAI_MODEL,
    # OPENAI_BASE_URL, ANTHROPIC_MODEL, ANTHROPIC_BASE_URL) are plain names that
    # Spring Boot does not relax-bind on its own. Mapping them here makes those
    # values effective while keeping the previous defaults unchanged when the
    # variables are absent.
    openai:
      # OPENAI_API_KEY is a plain name: Spring Boot binds only
      # SPRING_AI_OPENAI_API_KEY on its own, so the key is mapped explicitly.
      # An empty value keeps the bean guard (an empty key suppresses the model)
      # and leaves the previous defaults untouched when the variable is absent.
      api-key: ${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY:}}
      base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${OPENAI_MODEL:deepseek-chat}
      embedding:
        base-url: ${SPRING_AI_OPENAI_EMBEDDING_BASE_URL:https://api.siliconflow.cn}
        # Several OpenAI-compatible embedding providers reject the OpenAI-only
        # `dimensions` request field (SiliconFlow/BAAI bge-m3 answers 400 code
        # 20015 when it is present) and already return the native width.
        # Therefore it is opt-in: set
        # SPRING_AI_OPENAI_EMBEDDING_SEND_DIMENSIONS=true for text-embedding-3-*
        # style truncation. The declared width stays 1024 and is verified
        # against the real response, not assumed.
        send-dimensions: ${SPRING_AI_OPENAI_EMBEDDING_SEND_DIMENSIONS:false}
        options:
          model: ${SPRING_AI_OPENAI_EMBEDDING_MODEL:BAAI/bge-m3}
          dimensions: ${SPRING_AI_OPENAI_EMBEDDING_DIMENSIONS:1024}
    anthropic:
      # ANTHROPIC_API_KEY is a plain variable name, so it is mapped explicitly;
      # without this the @ConditionalOnProperty on spring.ai.anthropic.api-key
      # would never see it. An empty value still suppresses the bean.
      api-key: ${ANTHROPIC_API_KEY:}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
    mcp:
      server:
        name: claude-mem-mcp-server
        version: 0.1.0
        type: SYNC
        # SSE: Default for maximum client compatibility (no session management required)
        # STREAMABLE: Requires proper Mcp-Session-Id header handling by clients
        # STATELESS: Has Spring AI 1.1.2 bug (returns 404)
        protocol: SSE
        sse-endpoint: /sse
        sse-message-endpoint: /mcp/message
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

management:
  endpoints:
    web:
      exposure:
        # Deliberately narrow: only the three operator-facing endpoints. env,
        # beans, configprops and heapdump stay closed, so the scrape surface
        # cannot be used to read credentials or internals.
        include: health,metrics,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      # Histogram buckets for the two latency timers, so Grafana can compute
      # p50/p95 from _bucket series instead of only a mean.
      percentiles-histogram:
        cortexce.worker.processing: true
        cortexce.search.duration: true

logging:
  level:
    com.ablueforce: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    # Suppress Spring AI MCP BeanPostProcessor warnings (known issue: spring-ai/issues/4694)
    org.springframework.context.support.PostProcessorRegistrationDelegate: ERROR
    # Suppress MCP protocol version mismatch warnings (client/server negotiation)
    io.modelcontextprotocol.server.McpAsyncServer: ERROR
    io.modelcontextprotocol.server.McpStatelessAsyncServer: ERROR

# Claude-Mem configuration
claudemem:
  # LLM provider configuration: 'openai' or 'anthropic'
  # - openai: Uses OpenAI-compatible API (DeepSeek, etc.)
  # - anthropic: Uses Anthropic-compatible API (Claude, GLM, etc.)
  llm:
    provider: ${CLAUDEMEM_LLM_PROVIDER:openai}
    # Bound how long one provider call may occupy a worker. The read timeout must stay
    # above the longest legitimate reasoning answer (measured LongCat p95 ~50s) and
    # below the 10-minute stale-message threshold, so a hung provider fails and retries
    # instead of pinning a worker until the sweeper intervenes.
    connect-timeout-ms: ${CLAUDEMEM_LLM_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${CLAUDEMEM_LLM_READ_TIMEOUT_MS:120000}
    # Three attempts spaced 2s then 5s. Spring AI's default template is ten attempts with
    # backoff capped at three minutes, which let one slow response occupy a worker ~180s.
    retry-max-attempts: ${CLAUDEMEM_LLM_RETRY_MAX_ATTEMPTS:3}
    retry-backoff-ms: ${CLAUDEMEM_LLM_RETRY_BACKOFF_MS:2000}
    retry-max-backoff-ms: ${CLAUDEMEM_LLM_RETRY_MAX_BACKOFF_MS:5000}
  # Deterministic post-validation of extracted observations (no model call).
  # Disabling it bypasses every check and persists the parsed answer unchanged.
  extraction:
    # Upper bound on attempts per tool trace. A repeat happens only when the first answer
    # is malformed (provider failure, unparsable XML, or no type/title); the retries run
    # concurrently and the majority vote picks the label. Well-formed answers are accepted
    # as-is, because three calls per trace triple the token spend while the A12 floor
    # allows 1.5x (measured 2026-11-03). Set 1 to disable the repeat entirely.
    consistency-samples: ${CLAUDEMEM_EXTRACTION_CONSISTENCY_SAMPLES:3}
    validation:
      enabled: ${CLAUDEMEM_EXTRACTION_VALIDATION_ENABLED:true}
      max-title-length: ${CLAUDEMEM_EXTRACTION_MAX_TITLE_LENGTH:100}
      max-facts: ${CLAUDEMEM_EXTRACTION_MAX_FACTS:5}
      duplicate-lookback: ${CLAUDEMEM_EXTRACTION_DUPLICATE_LOOKBACK:20}
  # Log directory for structured logs (TS-compatible format)
  # Default: ~/.claude-mem/logs
  log.dir: ${CLAUDEMEM_LOG_DIR:${user.home}/.claude-mem/logs}
  # Stale message recovery settings
  stale-message:
    # Minutes after which a processing message is considered stale
    threshold-minutes: 10
    # Health indicator: stale count above this triggers Health.down()
    health-threshold: 5
    # Recovery task: run every N milliseconds (default: 5 minutes = 300000ms)
    recovery-interval-ms: 300000
  # Mode configuration
  # Mode profiles define observation types, concepts, and prompts for different use cases
  # Supports inheritance: code--zh (Chinese), code--chill (selective recording), etc.
  # Environment variable: CLAUDE_MEM_MODE
  mode: ${CLAUDE_MEM_MODE:code}
  # Custom modes directory (optional, for development)
  # Default: classpath:modes/ (JAR embedded) or plugin/modes/ (development)
  modes-dir: ${CLAUDE_MEM_MODES_DIR:}
